<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <main class="card">
        <div class="brand">CRM</div>
        <!-- The logged-in user's name is filled in by JavaScript. -->
        <h1>Hello, <span id="user-name">…</span></h1>
        <p class="subtitle">You are logged in to the CRM.</p>

        <!-- A small area showing the account details fetched from the API. -->
        <dl class="details">
            <dt>Email</dt>
            <dd id="user-email">…</dd>
        </dl>

        <!-- Administration shortcuts. Each link is shown only if the logged-in
             user holds the matching permission (filled in by JavaScript). -->
        <nav id="admin-nav" style="display:none; margin-bottom: 1.25rem;">
            <div class="divider"></div>
            <a id="users-link" href="/admin/users" class="btn secondary"
               style="display:none">Manage users</a>
        </nav>

        <!-- The logout button. -->
        <button id="logout-btn" class="btn">Log out</button>
    </main>

    <script src="/static/auth.js"></script>
    <script>
        // 1. Guard: if there is no token, bounce to the login page at once.
        Auth.requireLogin();

        // 2. Ask the API who we are and show the name + email.
        async function loadUser() {
            try {
                const response = await Auth.apiFetch("/auth/me");
                const user = await response.json();
                document.getElementById("user-name").textContent = user.full_name;
                document.getElementById("user-email").textContent = user.email;
            } catch (err) {
                // apiFetch already redirects on a 401; nothing else to do.
            }
        }
        loadUser();

        // Show the "Manage users" link only if the user has the users.read
        // permission. (The API still enforces this on its own.)
        async function loadAdminLinks() {
            try {
                const response = await Auth.apiFetch("/api/me/permissions");
                if (!response.ok) return;
                const { permissions } = await response.json();
                if (permissions.includes("users.read")) {
                    document.getElementById("admin-nav").style.display = "";
                    document.getElementById("users-link").style.display = "";
                }
            } catch (err) {
                // No admin links if we can't confirm the permission.
            }
        }
        loadAdminLinks();

        // 3. Wire up the logout button.
        document
            .getElementById("logout-btn")
            .addEventListener("click", () => Auth.logout());
    </script>
</body>
</html>
