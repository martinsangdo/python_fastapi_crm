<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers" class="active">Customers</a>
            <a href="/categories">Categories</a>
            <a href="/products">Products</a>
            <a href="/orders">Orders</a>
            <a href="/admin/users">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1 id="page-title">Customer detail</h1>
            <div class="page-actions">
                <a href="/customers" class="btn small secondary">Back to list</a>
                <!-- Edit button is shown only if the viewer has customers.update. -->
                <a id="edit-btn" href="#" class="btn small" style="display:none">Edit</a>
                <!-- Delete button is shown only if the viewer has customers.delete. -->
                <button id="delete-btn" class="btn small danger" style="display:none">Delete</button>
            </div>
        </div>

        <div id="banner" class="banner"></div>

        <div class="panel">
            <dl id="detail" class="detail-grid">
                <div class="state-row"><dd>Loading…</dd></div>
            </dl>
        </div>

        <!-- This customer's orders, if the viewer can see them. -->
        <div class="panel" id="orders-panel" style="display:none">
            <h2>Orders</h2>
            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Placed</th>
                        </tr>
                    </thead>
                    <tbody id="orders-rows">
                        <tr class="state-row"><td colspan="4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/customers.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        const customerId = "{{ customer_id }}";
        const detailEl = document.getElementById("detail");
        const banner = document.getElementById("banner");

        function field(label, valueHtml) {
            return `<div><dt>${Customers.escapeHtml(label)}</dt><dd>${valueHtml}</dd></div>`;
        }

        async function loadCustomer() {
            let myPermissions = new Set();
            try {
                myPermissions = await Customers.fetchMyPermissions();

                const response = await Auth.apiFetch(`/api/customers/${customerId}`);
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not load the customer.");
                    Customers.showBanner(banner, msg, "error");
                    detailEl.innerHTML = "";
                    return;
                }
                const customer = await response.json();

                document.getElementById("page-title").textContent = customer.full_name;

                detailEl.innerHTML = [
                    field("Full name", Customers.escapeHtml(customer.full_name)),
                    field("Email", Customers.escapeHtml(customer.email)),
                    field("Created", Customers.formatDate(customer.created_at)),
                ].join("");

                // Show Edit / Delete only to viewers who hold the permission.
                if (myPermissions.has("customers.update")) {
                    const editBtn = document.getElementById("edit-btn");
                    editBtn.href = `/customers/${customerId}/edit`;
                    editBtn.style.display = "";
                }
                if (myPermissions.has("customers.delete")) {
                    document.getElementById("delete-btn").style.display = "";
                }

                if (myPermissions.has("orders.read")) {
                    loadOrders();
                }
            } catch (err) { /* apiFetch handles 401 */ }
        }

        // A small, read-only table of this customer's orders (helps explain
        // why deletion might be blocked, and links straight to each order).
        async function loadOrders() {
            const panel = document.getElementById("orders-panel");
            const rowsEl = document.getElementById("orders-rows");
            panel.style.display = "";
            try {
                const response = await Auth.apiFetch(`/api/orders?customer_id=${customerId}&page_size=50`);
                if (!response.ok) {
                    rowsEl.innerHTML = '<tr class="state-row"><td colspan="4">Could not load orders.</td></tr>';
                    return;
                }
                const data = await response.json();
                if (data.items.length === 0) {
                    rowsEl.innerHTML = '<tr class="state-row"><td colspan="4">No orders yet.</td></tr>';
                    return;
                }
                rowsEl.innerHTML = data.items.map((order) => `<tr>
                    <td><a href="/orders/${order.id}">#${order.id}</a></td>
                    <td><span class="badge ${Customers.escapeHtml(order.status)}">${Customers.escapeHtml(order.status)}</span></td>
                    <td>$${Number(order.total_amount).toFixed(2)}</td>
                    <td>${Customers.formatDate(order.placed_at)}</td>
                </tr>`).join("");
            } catch (err) {
                rowsEl.innerHTML = '<tr class="state-row"><td colspan="4">Could not load orders.</td></tr>';
            }
        }

        document.getElementById("delete-btn").addEventListener("click", async () => {
            const ok = window.confirm("Delete this customer? This cannot be undone.");
            if (!ok) return;

            const button = document.getElementById("delete-btn");
            button.disabled = true;
            try {
                const response = await Auth.apiFetch(`/api/customers/${customerId}`, { method: "DELETE" });
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not delete the customer.");
                    Customers.showBanner(banner, msg, "error");
                    button.disabled = false;
                    return;
                }
                window.location.href = "/customers";
            } catch (err) {
                button.disabled = false;
            }
        });

        loadCustomer();
    </script>
</body>
</html>
