<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers" class="active">Customers</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1 id="page-title">Customer detail</h1>
            <div class="page-actions">
                <a href="/customers" class="btn small secondary">Back to list</a>
                <!-- Edit button is shown only if the viewer has customers.update. -->
                <a id="edit-btn" href="#" class="btn small" style="display:none">Edit</a>
                <!-- Delete button is shown only if the viewer has customers.delete. -->
                <button id="delete-btn" class="btn small danger" style="display:none">Delete</button>
            </div>
        </div>

        <div id="banner" class="banner"></div>

        <div class="panel">
            <dl id="detail" class="detail-grid">
                <div class="state-row"><dd>Loading…</dd></div>
            </dl>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/customers.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        const customerId = "{{ customer_id }}";
        const detailEl = document.getElementById("detail");
        const banner = document.getElementById("banner");

        function field(label, valueHtml) {
            return `<div><dt>${Customers.escapeHtml(label)}</dt><dd>${valueHtml}</dd></div>`;
        }

        function statusBadge(status) {
            const label = status.charAt(0).toUpperCase() + status.slice(1);
            return `<span class="badge ${Customers.escapeHtml(status)}">${label}</span>`;
        }

        async function loadCustomer() {
            let myPermissions = new Set();
            try {
                myPermissions = await Customers.fetchMyPermissions();

                const response = await Auth.apiFetch(`/api/customers/${customerId}`);
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not load the customer.");
                    Customers.showBanner(banner, msg, "error");
                    detailEl.innerHTML = "";
                    return;
                }
                const customer = await response.json();

                document.getElementById("page-title").textContent = customer.name;

                const ownerHtml = customer.owner
                    ? Customers.escapeHtml(customer.owner.full_name)
                    : '<span style="color:var(--muted)">Unassigned</span>';

                detailEl.innerHTML = [
                    field("Name", Customers.escapeHtml(customer.name)),
                    field("Status", statusBadge(customer.status)),
                    field("Email", Customers.escapeHtml(customer.email) || "—"),
                    field("Phone", Customers.escapeHtml(customer.phone) || "—"),
                    field("Company", Customers.escapeHtml(customer.company) || "—"),
                    field("Owner", ownerHtml),
                    field("Address", Customers.escapeHtml(customer.address_line) || "—"),
                    field("City", Customers.escapeHtml(customer.city) || "—"),
                    field("Country", Customers.escapeHtml(customer.country) || "—"),
                    field("Notes", customer.notes
                        ? Customers.escapeHtml(customer.notes).replaceAll("\n", "<br>")
                        : "—"),
                    field("Created", Customers.formatDate(customer.created_at)),
                    field("Updated", Customers.formatDate(customer.updated_at)),
                ].join("");

                // Show Edit / Delete only to viewers who hold the permission.
                if (myPermissions.has("customers.update")) {
                    const editBtn = document.getElementById("edit-btn");
                    editBtn.href = `/customers/${customerId}/edit`;
                    editBtn.style.display = "";
                }
                if (myPermissions.has("customers.delete")) {
                    document.getElementById("delete-btn").style.display = "";
                }
            } catch (err) { /* apiFetch handles 401 */ }
        }

        document.getElementById("delete-btn").addEventListener("click", async () => {
            const ok = window.confirm("Delete this customer? This cannot be undone.");
            if (!ok) return;

            const button = document.getElementById("delete-btn");
            button.disabled = true;
            try {
                const response = await Auth.apiFetch(`/api/customers/${customerId}`, { method: "DELETE" });
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not delete the customer.");
                    Customers.showBanner(banner, msg, "error");
                    button.disabled = false;
                    return;
                }
                window.location.href = "/customers";
            } catch (err) {
                button.disabled = false;
            }
        });

        loadCustomer();
    </script>
</body>
</html>
