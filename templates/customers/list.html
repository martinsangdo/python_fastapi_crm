<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <!-- Shared header bar. The "Customers" link is marked active. -->
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers" class="active">Customers</a>
            <a href="/categories">Categories</a>
            <a href="/products">Products</a>
            <a href="/orders">Orders</a>
            <a href="/admin/users">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>Customers</h1>
            <!-- Hidden until we confirm the viewer has customers.create. -->
            <a id="new-customer-btn" href="/customers/new" class="btn small" style="display:none">
                + New customer
            </a>
        </div>

        <div class="panel">
            <!-- Search. Changing it reloads the table. -->
            <div class="toolbar">
                <label class="field">
                    <span>Search</span>
                    <input id="f-search" type="text" placeholder="Name or email…" />
                </label>
            </div>

            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="full_name">Full name</th>
                            <th class="sortable" data-sort="email">Email</th>
                            <th class="sortable" data-sort="created_at">Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr class="state-row"><td colspan="4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Paging controls. -->
            <div class="pagination">
                <span id="page-info">—</span>
                <div class="pages">
                    <button id="prev-btn" class="btn small secondary" disabled>Previous</button>
                    <button id="next-btn" class="btn small secondary" disabled>Next</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/customers.js"></script>
    <script>
        // Guard: no token -> straight to /login.
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        // The current query state. Everything the table shows derives from this.
        const state = {
            search: "",
            sort: "created_at",
            order: "desc",
            page: 1,
            page_size: 20,
        };

        let myPermissions = new Set();   // the viewer's own permission codes

        const rowsEl = document.getElementById("rows");
        const pageInfoEl = document.getElementById("page-info");

        // Build the query string from the current state (skipping empty values).
        function buildQuery() {
            const params = new URLSearchParams();
            if (state.search) params.set("search", state.search);
            params.set("sort", state.sort);
            params.set("order", state.order);
            params.set("page", state.page);
            params.set("page_size", state.page_size);
            return params.toString();
        }

        // Draw one <tr> for a customer, gating the action buttons by permission.
        function renderRow(customer) {
            const actions = [];
            actions.push(`<a href="/customers/${customer.id}">View</a>`);

            if (myPermissions.has("customers.update")) {
                actions.push(`<a href="/customers/${customer.id}/edit">Edit</a>`);
            }
            if (myPermissions.has("customers.delete")) {
                actions.push(`<button class="danger" data-action="delete" data-id="${customer.id}" data-name="${Customers.escapeHtml(customer.full_name)}">Delete</button>`);
            }

            return `<tr>
                <td>${Customers.escapeHtml(customer.full_name)}</td>
                <td>${Customers.escapeHtml(customer.email)}</td>
                <td>${Customers.formatDate(customer.created_at)}</td>
                <td><div class="row-actions">${actions.join("")}</div></td>
            </tr>`;
        }

        // Fetch a page of customers and paint the table.
        async function loadCustomers() {
            rowsEl.innerHTML = '<tr class="state-row"><td colspan="4">Loading…</td></tr>';
            try {
                const response = await Auth.apiFetch(`/api/customers?${buildQuery()}`);
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not load customers.");
                    rowsEl.innerHTML = `<tr class="state-row"><td colspan="4">${Customers.escapeHtml(msg)}</td></tr>`;
                    return;
                }
                const data = await response.json();

                if (data.items.length === 0) {
                    rowsEl.innerHTML = '<tr class="state-row"><td colspan="4">No customers match your filters.</td></tr>';
                } else {
                    rowsEl.innerHTML = data.items.map(renderRow).join("");
                }

                // Update the pager.
                const shownPages = data.total_pages || 1;
                pageInfoEl.textContent =
                    `Page ${data.page} of ${shownPages} · ${data.total} customer(s)`;
                document.getElementById("prev-btn").disabled = data.page <= 1;
                document.getElementById("next-btn").disabled = data.page >= shownPages;
            } catch (err) {
                // apiFetch handles the 401 redirect; anything else shows here.
                rowsEl.innerHTML = '<tr class="state-row"><td colspan="4">Could not load customers.</td></tr>';
            }
        }

        // Handle delete clicks (event delegation).
        rowsEl.addEventListener("click", async (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const { action, id, name } = button.dataset;

            if (action === "delete") {
                const ok = window.confirm(`Delete ${name}? This cannot be undone.`);
                if (!ok) return;
            }

            button.disabled = true;
            try {
                const response = await Auth.apiFetch(`/api/customers/${id}`, { method: "DELETE" });
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Action failed.");
                    window.alert(msg);
                    button.disabled = false;
                    return;
                }
                loadCustomers();   // refresh the table to reflect the change
            } catch (err) {
                button.disabled = false;
            }
        });

        // ---- wire up the filter/search/sort/paging controls ----------------

        // Debounce the search box so we don't fire a request on every keystroke.
        let searchTimer = null;
        document.getElementById("f-search").addEventListener("input", (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                state.search = e.target.value.trim();
                state.page = 1;
                loadCustomers();
            }, 300);
        });

        // Clicking a sortable header sorts by it; clicking the same one flips order.
        document.querySelectorAll("th.sortable").forEach((th) => {
            th.addEventListener("click", () => {
                const column = th.dataset.sort;
                if (state.sort === column) {
                    state.order = state.order === "asc" ? "desc" : "asc";
                } else {
                    state.sort = column;
                    state.order = "desc";
                }
                state.page = 1;
                loadCustomers();
            });
        });

        document.getElementById("prev-btn").addEventListener("click", () => {
            if (state.page > 1) { state.page -= 1; loadCustomers(); }
        });
        document.getElementById("next-btn").addEventListener("click", () => {
            state.page += 1; loadCustomers();
        });

        // ---- start up --------------------------------------------------------
        async function init() {
            // Learn what we can do (drives the "New customer" button + row actions).
            myPermissions = await Customers.fetchMyPermissions();
            if (myPermissions.has("customers.create")) {
                document.getElementById("new-customer-btn").style.display = "";
            }

            await loadCustomers();
        }
        init();
    </script>
</body>
</html>
