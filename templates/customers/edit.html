<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers" class="active">Customers</a>
            <a href="/categories">Categories</a>
            <a href="/products">Products</a>
            <a href="/orders">Orders</a>
            <a href="/admin/users">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>Edit customer</h1>
            <a id="detail-link" href="/customers" class="btn small secondary">Back to detail</a>
        </div>

        <div class="panel">
            <form id="edit-form" class="admin-form">
                <div id="banner" class="banner"></div>

                <label class="field">
                    <span>Full name</span>
                    <input type="text" name="full_name" maxlength="255" required />
                </label>

                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" required />
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">Save changes</button>
                    <a id="cancel-link" href="/customers" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/customers.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        // The server injected the customer id into the page.
        const customerId = "{{ customer_id }}";
        const editForm = document.getElementById("edit-form");
        const banner = document.getElementById("banner");

        // Point the "Back"/"Cancel" links at this customer's detail page.
        document.getElementById("detail-link").href = `/customers/${customerId}`;
        document.getElementById("cancel-link").href = `/customers/${customerId}`;

        async function loadCustomer() {
            try {
                const response = await Auth.apiFetch(`/api/customers/${customerId}`);
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not load the customer.");
                    Customers.showBanner(banner, msg, "error");
                    return;
                }
                const customer = await response.json();
                editForm.full_name.value = customer.full_name;
                editForm.email.value = customer.email;
            } catch (err) { /* apiFetch handles 401 */ }
        }

        editForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            Customers.hideBanner(banner);
            const submitBtn = editForm.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            const payload = {
                full_name: editForm.full_name.value.trim(),
                email: editForm.email.value.trim(),
            };

            try {
                const response = await Auth.apiFetch(`/api/customers/${customerId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const msg = await Customers.errorMessage(response, "Could not save changes.");
                    Customers.showBanner(banner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }
                Customers.showBanner(banner, "Changes saved.", "success");
                submitBtn.disabled = false;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });

        loadCustomer();
    </script>
</body>
</html>
