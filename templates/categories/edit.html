<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers">Customers</a>
            <a href="/categories" class="active">Categories</a>
            <a href="/products">Products</a>
            <a href="/orders">Orders</a>
            <a href="/admin/users">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>Edit category</h1>
            <a id="detail-link" href="/categories" class="btn small secondary">Back to detail</a>
        </div>

        <div class="panel">
            <form id="edit-form" class="admin-form">
                <div id="banner" class="banner"></div>

                <label class="field">
                    <span>Name</span>
                    <input type="text" name="name" maxlength="255" required />
                </label>

                <label class="field">
                    <span>Slug</span>
                    <input type="text" name="slug" maxlength="255" placeholder="Leave blank to regenerate from the name" />
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">Save changes</button>
                    <a id="cancel-link" href="/categories" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/categories.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        const categoryId = "{{ category_id }}";
        const editForm = document.getElementById("edit-form");
        const banner = document.getElementById("banner");

        document.getElementById("detail-link").href = `/categories/${categoryId}`;
        document.getElementById("cancel-link").href = `/categories/${categoryId}`;

        async function loadCategory() {
            try {
                const response = await Auth.apiFetch(`/api/categories/${categoryId}`);
                if (!response.ok) {
                    const msg = await Categories.errorMessage(response, "Could not load the category.");
                    Categories.showBanner(banner, msg, "error");
                    return;
                }
                const category = await response.json();
                editForm.name.value = category.name;
                editForm.slug.value = category.slug;
            } catch (err) { /* apiFetch handles 401 */ }
        }

        editForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            Categories.hideBanner(banner);
            const submitBtn = editForm.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            const payload = {
                name: editForm.name.value.trim(),
                slug: editForm.slug.value.trim() || null,
            };

            try {
                const response = await Auth.apiFetch(`/api/categories/${categoryId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const msg = await Categories.errorMessage(response, "Could not save changes.");
                    Categories.showBanner(banner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }
                const saved = await response.json();
                editForm.slug.value = saved.slug;
                Categories.showBanner(banner, "Changes saved.", "success");
                submitBtn.disabled = false;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });

        loadCategory();
    </script>
</body>
</html>
