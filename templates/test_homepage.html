<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage</title>

  <!-- Inter is the typeface used by the Figma design (Simple Design System). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================================================
       Design tokens — mirrored from Figma's Simple Design System.
       ============================================================ */
    :root {
      /* Colors */
      --color-text: #1e1e1e;
      --color-text-secondary: #757575;
      --color-bg: #ffffff;
      --color-bg-secondary: #f5f5f5;
      --color-neutral: #e3e3e3;
      --color-border: #d9d9d9;
      --color-border-strong: #767676;
      --color-brand: #2c2c2c;
      --color-on-brand: #f5f5f5;

      /* Typography */
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

      /* Spacing scale */
      --space-100: 4px;
      --space-200: 8px;
      --space-300: 12px;
      --space-400: 16px;
      --space-600: 24px;
      --space-800: 32px;
      --space-1200: 48px;
      --space-1600: 64px;
      --space-4000: 160px;

      --radius: 8px;
      --container: 1200px;
    }

    /* ============================================================
       Reset
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-family);
      color: var(--color-text);
      background-color: var(--color-bg);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding-left: var(--space-800);
      padding-right: var(--space-800);
      width: 100%;
    }

    /* ============================================================
       Buttons
       ============================================================ */
    .btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      background: transparent;
      white-space: nowrap;
      transition: filter 0.15s ease, background-color 0.15s ease;
    }

    .btn:hover {
      filter: brightness(0.96);
    }

    .btn--sm {
      padding: 8px 12px;
      font-size: 14px;
    }

    .btn--primary {
      background-color: var(--color-brand);
      border-color: var(--color-brand);
      color: var(--color-on-brand);
    }

    .btn--neutral {
      background-color: var(--color-bg);
      border-color: var(--color-border);
      color: var(--color-text);
    }

    /* ============================================================
       Header
       ============================================================ */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }

    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-600);
      height: 68px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--color-text);
      flex-shrink: 0;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: var(--space-200);
      margin-left: auto;
    }

    .pill {
      font-size: 16px;
      line-height: 1;
      padding: 8px 12px;
      border-radius: var(--radius);
      color: var(--color-text);
      transition: background-color 0.15s ease;
    }

    .pill:hover {
      background-color: var(--color-bg-secondary);
    }

    .pill.is-active {
      background-color: var(--color-bg-secondary);
      font-weight: 600;
    }

    .header__auth {
      display: flex;
      align-items: center;
      gap: var(--space-300);
      flex-shrink: 0;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--color-text);
    }

    /* ============================================================
       Hero
       ============================================================ */
    .hero {
      background-color: var(--color-bg-secondary);
      text-align: center;
      padding: var(--space-4000) var(--space-800);
    }

    .hero__title {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -3px;
    }

    .hero__subtitle {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-secondary);
      margin-top: var(--space-400);
    }

    /* ============================================================
       Double image panel
       ============================================================ */
    .panel {
      padding: var(--space-1600) var(--space-800);
    }

    .panel__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-600);
    }

    /* Generic image placeholder (matches the SDS "Image Placeholder"). */
    .image-ph {
      background-color: var(--color-neutral);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b3b3b3;
      overflow: hidden;
    }

    .panel__grid .image-ph {
      aspect-ratio: 21 / 9;
    }

    .image-ph svg {
      width: 48px;
      height: 48px;
    }

    /* ============================================================
       Section headings
       ============================================================ */
    .section {
      padding: var(--space-1600) var(--space-800);
    }

    .section__head {
      margin-bottom: var(--space-800);
    }

    .section__title {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .section__subtitle {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-text-secondary);
      margin-top: var(--space-200);
    }

    /* ============================================================
       Cards
       ============================================================ */
    .card {
      display: flex;
      gap: var(--space-600);
      padding: var(--space-600);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background-color: var(--color-bg);
    }

    .card__image {
      flex-shrink: 0;
      width: 160px;
      height: 160px;
    }

    .card__image svg {
      width: 40px;
      height: 40px;
    }

    .card__body {
      display: flex;
      flex-direction: column;
      gap: var(--space-200);
      min-width: 0;
    }

    .card__title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }

    .card__text {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--color-text-secondary);
    }

    .card__actions {
      margin-top: var(--space-200);
    }

    /* Content list — full-width stacked cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-600);
    }

    /* Image grid — 3-up responsive grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-1200) var(--space-600);
    }

    .card-grid .card {
      border: none;
      padding: 0;
    }

    .card-grid .card__image {
      width: 120px;
      height: 120px;
    }

    /* ============================================================
       Footer
       ============================================================ */
    .footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-800) var(--space-800) var(--space-1600);
    }

    .footer__inner {
      display: flex;
      gap: var(--space-1600);
      flex-wrap: wrap;
    }

    .footer__brand {
      display: flex;
      flex-direction: column;
      gap: var(--space-600);
      min-width: 160px;
    }

    .socials {
      display: flex;
      gap: var(--space-400);
    }

    .socials a {
      color: var(--color-text);
      display: inline-flex;
    }

    .socials svg {
      width: 24px;
      height: 24px;
    }

    .footer__cols {
      display: flex;
      gap: var(--space-1600);
      flex-wrap: wrap;
      margin-left: auto;
    }

    .footer__col {
      min-width: 140px;
    }

    .footer__col h4 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: var(--space-400);
    }

    .footer__col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-300);
    }

    .footer__col a {
      font-size: 16px;
      color: var(--color-text);
    }

    .footer__col a:hover {
      color: var(--color-text-secondary);
    }

    /* Standalone bottom button (present in the source frame) */
    .foot-actions {
      padding: 0 var(--space-800) var(--space-1600);
    }

    /* ============================================================
       Responsive
       ============================================================ */
    @media (max-width: 900px) {
      .nav,
      .header__auth {
        display: none;
      }

      .nav-toggle {
        display: inline-flex;
      }

      /* Mobile dropdown menu */
      .nav.is-open,
      .header__auth.is-open {
        display: flex;
        position: absolute;
        left: 0;
        right: 0;
        top: 68px;
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-100);
        background-color: var(--color-bg);
        border-bottom: 1px solid var(--color-border);
        padding: var(--space-400) var(--space-800);
        margin: 0;
      }

      .header__auth.is-open {
        top: auto;
        border-top: 1px solid var(--color-border);
        border-bottom: none;
        padding-top: 0;
      }

      .hero__title {
        font-size: 48px;
        letter-spacing: -2px;
      }

      .hero__subtitle {
        font-size: 24px;
      }

      .hero {
        padding: var(--space-4000) var(--space-800);
        padding-top: 96px;
        padding-bottom: 96px;
      }

      .card-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .panel__grid {
        grid-template-columns: 1fr;
      }

      .card {
        flex-direction: column;
      }

      .card__image {
        width: 100%;
        height: 200px;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

      .card-grid .card {
        flex-direction: row;
      }

      .card-grid .card__image {
        width: 120px;
        height: 120px;
      }

      .footer__cols {
        gap: var(--space-800);
      }
    }
  </style>
</head>

<body>
  <!-- ================= Header ================= -->
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="brand" aria-label="Home">
        <!-- Figma-style logo mark -->
        <svg width="24" height="35" viewBox="0 0 24 35" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 35a6 6 0 0 0 6-6v-6H6a6 6 0 0 0 0 12z" fill="#0ACF83"/>
          <path d="M0 17.5A6 6 0 0 1 6 11.5h6v12H6a6 6 0 0 1-6-6z" fill="#A259FF"/>
          <path d="M0 6a6 6 0 0 1 6-6h6v12H6A6 6 0 0 1 0 6z" fill="#F24E1E"/>
          <path d="M12 0h6a6 6 0 0 1 0 12h-6V0z" fill="#FF7262"/>
          <path d="M24 17.5a6 6 0 1 1-12 0 6 6 0 0 1 12 0z" fill="#1ABCFE"/>
        </svg>
      </a>

      <nav class="nav" id="primaryNav">
        <a href="#" class="pill is-active">Products</a>
        <a href="#" class="pill">Solutions</a>
        <a href="#" class="pill">Community</a>
        <a href="#" class="pill">Resources</a>
        <a href="#" class="pill">Pricing</a>
        <a href="#" class="pill">Contact</a>
      </nav>

      <div class="header__auth" id="headerAuth">
        <button class="btn btn--neutral btn--sm">Sign in</button>
        <button class="btn btn--primary btn--sm">Register</button>
      </div>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ================= Hero ================= -->
  <section class="hero">
    <h1 class="hero__title">Title</h1>
    <p class="hero__subtitle">Subtitle</p>
  </section>

  <!-- ================= Double image panel ================= -->
  <section class="panel">
    <div class="container">
      <div class="panel__grid">
        <div class="image-ph" role="img" aria-label="Image placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <div class="image-ph" role="img" aria-label="Image placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= Card grid — content list ================= -->
  <section class="section">
    <div class="container">
      <div class="section__head">
        <h2 class="section__title">Heading</h2>
        <p class="section__subtitle">Subheading</p>
      </div>

      <div class="card-list" id="contentList">
        <!-- Cards injected by JavaScript -->
      </div>
    </div>
  </section>

  <!-- ================= Card grid — images ================= -->
  <section class="section">
    <div class="container">
      <div class="section__head">
        <h2 class="section__title">Heading</h2>
        <p class="section__subtitle">Subheading</p>
      </div>

      <div class="card-grid" id="imageGrid">
        <!-- Cards injected by JavaScript -->
      </div>
    </div>
  </section>

  <!-- ================= Footer ================= -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <a href="#" class="brand" aria-label="Home">
          <svg width="24" height="35" viewBox="0 0 24 35" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 35a6 6 0 0 0 6-6v-6H6a6 6 0 0 0 0 12z" fill="#0ACF83"/>
            <path d="M0 17.5A6 6 0 0 1 6 11.5h6v12H6a6 6 0 0 1-6-6z" fill="#A259FF"/>
            <path d="M0 6a6 6 0 0 1 6-6h6v12H6A6 6 0 0 1 0 6z" fill="#F24E1E"/>
            <path d="M12 0h6a6 6 0 0 1 0 12h-6V0z" fill="#FF7262"/>
            <path d="M24 17.5a6 6 0 1 1-12 0 6 6 0 0 1 12 0z" fill="#1ABCFE"/>
          </svg>
        </a>
        <div class="socials">
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2h3.3l-7.2 8.3L23.7 22h-6.6l-5.2-6.8L5.9 22H2.6l7.7-8.8L1.7 2h6.8l4.7 6.2L18.9 2zm-1.2 18h1.8L7.1 3.9H5.2L17.7 20z"/></svg>
          </a>
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="#" aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.3 5 12 5 12 5s-7.3 0-8.8.4a2.5 2.5 0 0 0-1.8 1.8C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.7 19 12 19 12 19s7.3 0 8.8-.4a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12zM9.8 15.3V8.7l5.7 3.3-5.7 3.3z"/></svg>
          </a>
          <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 3H3.6C3.3 3 3 3.3 3 3.6v16.8c0 .3.3.6.6.6h16.8c.3 0 .6-.3.6-.6V3.6c0-.3-.3-.6-.6-.6zM8.3 18.3H5.6V9.7h2.7v8.6zM7 8.5a1.6 1.6 0 1 1 0-3.1 1.6 1.6 0 0 1 0 3.1zm11.3 9.8h-2.7v-4.2c0-1 0-2.3-1.4-2.3s-1.6 1.1-1.6 2.2v4.3h-2.7V9.7h2.6v1.2h.1c.4-.7 1.2-1.4 2.5-1.4 2.7 0 3.2 1.8 3.2 4.1v4.7z"/></svg>
          </a>
        </div>
      </div>

      <div class="footer__cols" id="footerCols">
        <!-- Columns injected by JavaScript -->
      </div>
    </div>
  </footer>

  <div class="foot-actions">
    <div class="container">
      <button class="btn btn--primary btn--sm" id="backToTop">Button</button>
    </div>
  </div>

  <!-- ================= JavaScript ================= -->
  <script>
    // --- Shared placeholder image glyph ---
    const IMG_GLYPH = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>`;

    const BODY_TEXT =
      "Body text for whatever you’d like to say. Add main takeaway points, " +
      "quotes, anecdotes, or even a very very short story.";

    // --- Content-list cards (with a button) ---
    function contentCard(withButton) {
      const actions = withButton
        ? `<div class="card__actions"><button class="btn btn--neutral btn--sm">Button</button></div>`
        : "";
      return `
        <article class="card">
          <div class="image-ph card__image" role="img" aria-label="Image placeholder">${IMG_GLYPH}</div>
          <div class="card__body">
            <h3 class="card__title">Title</h3>
            <p class="card__text">${BODY_TEXT}</p>
            ${actions}
          </div>
        </article>`;
    }

    // Render 3 stacked cards with buttons.
    document.getElementById("contentList").innerHTML =
      Array.from({ length: 3 }, () => contentCard(true)).join("");

    // Render 6 image-grid cards without buttons.
    document.getElementById("imageGrid").innerHTML =
      Array.from({ length: 6 }, () => contentCard(false)).join("");

    // --- Footer columns ---
    const FOOTER = [
      {
        title: "Use cases",
        links: ["UI design", "UX design", "Wireframing", "Diagramming",
                "Brainstorming", "Online whiteboard", "Team collaboration"],
      },
      {
        title: "Explore",
        links: ["Design", "Prototyping", "Development features", "Design systems",
                "Collaboration features", "Design process", "FigJam"],
      },
      {
        title: "Resources",
        links: ["Blog", "Best practices", "Colors", "Color wheel",
                "Support", "Developers", "Resource library"],
      },
    ];

    document.getElementById("footerCols").innerHTML = FOOTER.map((col) => `
      <div class="footer__col">
        <h4>${col.title}</h4>
        <ul>${col.links.map((l) => `<li><a href="#">${l}</a></li>`).join("")}</ul>
      </div>`).join("");

    // --- Mobile nav toggle ---
    const toggle = document.getElementById("navToggle");
    const nav = document.getElementById("primaryNav");
    const auth = document.getElementById("headerAuth");
    toggle.addEventListener("click", () => {
      const open = nav.classList.toggle("is-open");
      auth.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
    });

    // --- Active nav pill ---
    nav.querySelectorAll(".pill").forEach((pill) => {
      pill.addEventListener("click", (e) => {
        e.preventDefault();
        nav.querySelector(".pill.is-active")?.classList.remove("is-active");
        pill.classList.add("is-active");
      });
    });

    // --- Bottom button: back to top ---
    document.getElementById("backToTop").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
