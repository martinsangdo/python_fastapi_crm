<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/admin/users" class="active">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>Edit user</h1>
            <a id="detail-link" href="/admin/users" class="btn small secondary">Back to detail</a>
        </div>

        <!-- Panel 1: edit name / role / active status. -->
        <div class="panel">
            <form id="edit-form" class="admin-form">
                <div id="banner" class="banner"></div>

                <label class="field">
                    <span>Full name</span>
                    <input type="text" name="full_name" maxlength="255" required />
                </label>

                <label class="field">
                    <span>Email (read-only)</span>
                    <!-- Changing the login email is intentionally out of scope. -->
                    <input type="email" name="email" disabled />
                </label>

                <label class="field">
                    <span>Role</span>
                    <select name="role_id">
                        <option value="">No role</option>
                    </select>
                </label>

                <label class="field check-field">
                    <input type="checkbox" name="is_active" />
                    <span>Active (can log in)</span>
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">Save changes</button>
                    <a id="cancel-link" href="/admin/users" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Panel 2: reset the password (a separate action, separate call). -->
        <div class="panel">
            <form id="password-form" class="admin-form">
                <h1 style="font-size:1.1rem;text-align:left;">Reset password</h1>
                <div id="pw-banner" class="banner"></div>

                <label class="field">
                    <span>New password</span>
                    <input type="password" name="new_password" minlength="8"
                           autocomplete="new-password" required />
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn secondary">Reset password</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/users.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        // The server injected the user id into the page.
        const userId = "{{ user_id }}";
        const editForm = document.getElementById("edit-form");
        const banner = document.getElementById("banner");
        const pwForm = document.getElementById("password-form");
        const pwBanner = document.getElementById("pw-banner");

        // Point the "Back"/"Cancel" links at this user's detail page.
        document.getElementById("detail-link").href = `/admin/users/${userId}`;
        document.getElementById("cancel-link").href = `/admin/users/${userId}`;

        // Fill the role dropdown, then load the user and preselect their role.
        async function loadRoles() {
            try {
                const response = await Auth.apiFetch("/api/roles");
                if (!response.ok) return;
                const roles = await response.json();
                for (const role of roles) {
                    const opt = document.createElement("option");
                    opt.value = role.id;
                    opt.textContent = role.name;
                    editForm.role_id.appendChild(opt);
                }
            } catch (err) { /* leave "No role" only */ }
        }

        async function loadUser() {
            try {
                const response = await Auth.apiFetch(`/api/users/${userId}`);
                if (!response.ok) {
                    const msg = await Users.errorMessage(response, "Could not load the user.");
                    Users.showBanner(banner, msg, "error");
                    return;
                }
                const user = await response.json();
                editForm.full_name.value = user.full_name;
                editForm.email.value = user.email;
                editForm.role_id.value = user.role ? user.role.id : "";
                editForm.is_active.checked = user.is_active;
            } catch (err) { /* apiFetch handles 401 */ }
        }

        // Save name / role / active status via PATCH.
        editForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            Users.hideBanner(banner);
            const submitBtn = editForm.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            const payload = {
                full_name: editForm.full_name.value.trim(),
                role_id: editForm.role_id.value || null,
                is_active: editForm.is_active.checked,
            };

            try {
                const response = await Auth.apiFetch(`/api/users/${userId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const msg = await Users.errorMessage(response, "Could not save changes.");
                    Users.showBanner(banner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }
                Users.showBanner(banner, "Changes saved.", "success");
                submitBtn.disabled = false;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });

        // Reset the password via its own endpoint.
        pwForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            Users.hideBanner(pwBanner);
            const submitBtn = pwForm.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            try {
                const response = await Auth.apiFetch(`/api/users/${userId}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ new_password: pwForm.new_password.value }),
                });
                if (!response.ok) {
                    const msg = await Users.errorMessage(response, "Could not reset the password.");
                    Users.showBanner(pwBanner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }
                pwForm.reset();
                Users.showBanner(pwBanner, "Password reset.", "success");
                submitBtn.disabled = false;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });

        // Start up: roles first, then the user (so preselecting the role works).
        (async function init() {
            await loadRoles();
            await loadUser();
        })();
    </script>
</body>
</html>
