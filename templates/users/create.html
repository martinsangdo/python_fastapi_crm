<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/admin/users" class="active">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>New user</h1>
            <a href="/admin/users" class="btn small secondary">Back to list</a>
        </div>

        <div class="panel">
            <form id="create-form" class="admin-form">
                <div id="banner" class="banner"></div>

                <label class="field">
                    <span>Full name</span>
                    <input type="text" name="full_name" maxlength="255" required />
                </label>

                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="off" required />
                </label>

                <label class="field">
                    <span>Password</span>
                    <!-- minlength matches the 8-character rule on the server. -->
                    <input type="password" name="password" minlength="8"
                           autocomplete="new-password" required />
                </label>

                <label class="field">
                    <span>Role</span>
                    <select name="role_id">
                        <option value="">No role</option>
                    </select>
                </label>

                <label class="field check-field">
                    <input type="checkbox" name="is_active" checked />
                    <span>Active (can log in)</span>
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">Create user</button>
                    <a href="/admin/users" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/users.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        const form = document.getElementById("create-form");
        const banner = document.getElementById("banner");

        // Fill the role dropdown.
        async function loadRoles() {
            try {
                const response = await Auth.apiFetch("/api/roles");
                if (!response.ok) return;
                const roles = await response.json();
                const select = form.role_id;
                for (const role of roles) {
                    const opt = document.createElement("option");
                    opt.value = role.id;
                    opt.textContent = role.name;
                    select.appendChild(opt);
                }
            } catch (err) { /* leave "No role" only */ }
        }
        loadRoles();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            Users.hideBanner(banner);

            const submitBtn = form.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            // Build the request body. role_id "" means "no role" -> send null.
            const payload = {
                full_name: form.full_name.value.trim(),
                email: form.email.value.trim(),
                password: form.password.value,
                role_id: form.role_id.value || null,
                is_active: form.is_active.checked,
            };

            try {
                const response = await Auth.apiFetch("/api/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const msg = await Users.errorMessage(response, "Could not create user.");
                    Users.showBanner(banner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }

                const created = await response.json();
                // Land on the new user's detail page.
                window.location.href = `/admin/users/${created.id}`;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
