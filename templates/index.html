<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Makes the page responsive on phones, tablets, and desktops. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The page title shown on the browser tab. Value comes from app.py. -->
    <title>{{ title }}</title>

    <!-- Link to our external CSS file served from the /static folder. -->
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <!-- A centered card holding the welcome content. -->
    <main class="card">
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
    </main>

    <!-- Our shared auth helper (login state, landing-route lookup). -->
    <script src="/static/auth.js"></script>
    <script>
        // A logged-in visitor doesn't need the public welcome page — send them
        // straight to the landing page their permissions allow, same as the
        // already-logged-in redirect on /login and /register.
        if (Auth.isLoggedIn()) {
            window.location.href = Auth.getLandingRoute();
        }
    </script>
</body>
</html>
