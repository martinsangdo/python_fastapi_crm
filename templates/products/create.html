<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers">Customers</a>
            <a href="/categories">Categories</a>
            <a href="/products" class="active">Products</a>
            <a href="/orders">Orders</a>
            <a href="/admin/users">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>New product</h1>
            <a href="/products" class="btn small secondary">Back to list</a>
        </div>

        <div class="panel">
            <form id="create-form" class="admin-form">
                <div id="banner" class="banner"></div>

                <label class="field">
                    <span>Category</span>
                    <select name="category_id" required>
                        <option value="" disabled selected>Choose a category…</option>
                    </select>
                </label>

                <label class="field">
                    <span>SKU</span>
                    <input type="text" name="sku" maxlength="64" required />
                </label>

                <label class="field">
                    <span>Name</span>
                    <input type="text" name="name" maxlength="255" required />
                </label>

                <label class="field">
                    <span>Description</span>
                    <textarea name="description" rows="3"></textarea>
                </label>

                <label class="field">
                    <span>Price</span>
                    <input type="number" name="price" min="0" step="0.01" required />
                </label>

                <label class="field">
                    <span>Stock quantity</span>
                    <input type="number" name="stock_quantity" min="0" step="1" value="0" required />
                </label>

                <label class="field check-field">
                    <input type="checkbox" name="is_active" checked />
                    <span>Active (visible to new orders)</span>
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">Create product</button>
                    <a href="/products" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/products.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        const form = document.getElementById("create-form");
        const banner = document.getElementById("banner");

        async function loadCategories() {
            try {
                const response = await Auth.apiFetch("/api/categories?page_size=100&sort=name&order=asc");
                if (!response.ok) return;
                const data = await response.json();
                for (const category of data.items) {
                    const opt = document.createElement("option");
                    opt.value = category.id;
                    opt.textContent = category.name;
                    form.category_id.appendChild(opt);
                }
            } catch (err) { /* dropdown stays with just the placeholder */ }
        }
        loadCategories();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            Products.hideBanner(banner);

            const submitBtn = form.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            const payload = {
                category_id: Number(form.category_id.value),
                sku: form.sku.value.trim(),
                name: form.name.value.trim(),
                description: form.description.value.trim() || null,
                price: form.price.value,
                stock_quantity: Number(form.stock_quantity.value),
                is_active: form.is_active.checked,
            };

            try {
                const response = await Auth.apiFetch("/api/products", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const msg = await Products.errorMessage(response, "Could not create product.");
                    Products.showBanner(banner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }

                const created = await response.json();
                window.location.href = `/products/${created.id}`;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
