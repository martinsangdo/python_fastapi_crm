<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="admin-page">
    <header class="topbar">
        <div class="brand">CRM</div>
        <nav class="topnav">
            <a href="/dashboard">Dashboard</a>
            <a href="/customers">Customers</a>
            <a href="/categories">Categories</a>
            <a href="/products" class="active">Products</a>
            <a href="/orders">Orders</a>
            <a href="/admin/users">Users</a>
        </nav>
        <button id="logout-btn" class="btn small secondary">Log out</button>
    </header>

    <main class="admin-main">
        <div class="page-head">
            <h1>Edit product</h1>
            <a id="detail-link" href="/products" class="btn small secondary">Back to detail</a>
        </div>

        <div class="panel">
            <form id="edit-form" class="admin-form">
                <div id="banner" class="banner"></div>

                <label class="field">
                    <span>Category</span>
                    <select name="category_id" required></select>
                </label>

                <label class="field">
                    <span>SKU</span>
                    <input type="text" name="sku" maxlength="64" required />
                </label>

                <label class="field">
                    <span>Name</span>
                    <input type="text" name="name" maxlength="255" required />
                </label>

                <label class="field">
                    <span>Description</span>
                    <textarea name="description" rows="3"></textarea>
                </label>

                <label class="field">
                    <span>Price</span>
                    <input type="number" name="price" min="0" step="0.01" required />
                </label>

                <label class="field">
                    <span>Stock quantity</span>
                    <input type="number" name="stock_quantity" min="0" step="1" required />
                </label>

                <label class="field check-field">
                    <input type="checkbox" name="is_active" />
                    <span>Active (visible to new orders)</span>
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">Save changes</button>
                    <a id="cancel-link" href="/products" class="btn secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/auth.js"></script>
    <script src="/static/products.js"></script>
    <script>
        Auth.requireLogin();
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());

        const productId = "{{ product_id }}";
        const editForm = document.getElementById("edit-form");
        const banner = document.getElementById("banner");

        document.getElementById("detail-link").href = `/products/${productId}`;
        document.getElementById("cancel-link").href = `/products/${productId}`;

        async function loadCategories() {
            try {
                const response = await Auth.apiFetch("/api/categories?page_size=100&sort=name&order=asc");
                if (!response.ok) return;
                const data = await response.json();
                for (const category of data.items) {
                    const opt = document.createElement("option");
                    opt.value = category.id;
                    opt.textContent = category.name;
                    editForm.category_id.appendChild(opt);
                }
            } catch (err) { /* leave the dropdown empty */ }
        }

        async function loadProduct() {
            try {
                const response = await Auth.apiFetch(`/api/products/${productId}`);
                if (!response.ok) {
                    const msg = await Products.errorMessage(response, "Could not load the product.");
                    Products.showBanner(banner, msg, "error");
                    return;
                }
                const product = await response.json();
                editForm.category_id.value = String(product.category.id);
                editForm.sku.value = product.sku;
                editForm.name.value = product.name;
                editForm.description.value = product.description || "";
                editForm.price.value = product.price;
                editForm.stock_quantity.value = product.stock_quantity;
                editForm.is_active.checked = product.is_active;
            } catch (err) { /* apiFetch handles 401 */ }
        }

        editForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            Products.hideBanner(banner);
            const submitBtn = editForm.querySelector("button[type=submit]");
            submitBtn.disabled = true;

            const payload = {
                category_id: Number(editForm.category_id.value),
                sku: editForm.sku.value.trim(),
                name: editForm.name.value.trim(),
                description: editForm.description.value.trim() || null,
                price: editForm.price.value,
                stock_quantity: Number(editForm.stock_quantity.value),
                is_active: editForm.is_active.checked,
            };

            try {
                const response = await Auth.apiFetch(`/api/products/${productId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!response.ok) {
                    const msg = await Products.errorMessage(response, "Could not save changes.");
                    Products.showBanner(banner, msg, "error");
                    submitBtn.disabled = false;
                    return;
                }
                Products.showBanner(banner, "Changes saved.", "success");
                submitBtn.disabled = false;
            } catch (err) {
                submitBtn.disabled = false;
            }
        });

        (async function init() {
            await loadCategories();
            await loadProduct();
        })();
    </script>
</body>
</html>
